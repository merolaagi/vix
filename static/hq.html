<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vix HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--panel:#141a22;--panel2:#1a222c;--line:#263140;--ink:#d8e1ea;--dim:#8a98a8;--accent:#4fd1c5;--amber:#f2b84b;--red:#ef6b6b;--green:#5fd38d;--violet:#a78bfa;
--mono:'IBM Plex Mono',ui-monospace,monospace;--sans:'IBM Plex Sans',system-ui,sans-serif}
*{box-sizing:border-box}
a{color:var(--accent)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
.brand{font:600 18px var(--mono);letter-spacing:.04em}.brand b{color:var(--accent)}
.tag{color:var(--dim);font-size:12px}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button{background:none;border:1px solid transparent;color:var(--dim);padding:6px 12px;border-radius:6px;cursor:pointer;font:500 13px var(--sans)}
nav button.on{color:var(--ink);border-color:var(--line);background:var(--panel)}
main{padding:20px;max-width:1400px;margin:0 auto}
.tab{display:none}.tab.on{display:block}
h2{font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin:26px 0 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi .v{font:600 20px var(--mono)}.kpi .l{color:var(--dim);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.card.super{border-color:#3b4f63;background:linear-gradient(180deg,#17212c,var(--panel))}
.card h3{margin:0 0 2px;font-size:15px}.agent{font:600 12px var(--mono);color:var(--accent)}
.card.super .agent{color:var(--violet)}
.mission{color:var(--dim);font-size:13px;margin:6px 0 10px}
.pb{border-top:1px solid var(--line);padding:8px 0}
.pb .t{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pb .d{color:var(--dim);font-size:12px}
.params{display:none;margin-top:8px;gap:6px;flex-wrap:wrap}.params.on{display:flex}
.params label{font-size:11px;color:var(--dim);display:flex;flex-direction:column;gap:2px}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:5px 7px;font:12px var(--mono)}
button.b{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:5px 10px;cursor:pointer;font:500 12px var(--sans);white-space:nowrap}
button.b:hover{border-color:var(--accent)}button.b.go{border-color:#2f6f69;color:var(--accent)}
button.b.ok{color:var(--green);border-color:#2c5b40}button.b.no{color:var(--red);border-color:#6a2f2f}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:500;font-size:12px}td.n{font-family:var(--mono);text-align:right}
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.st{font:600 11px var(--mono);padding:1px 6px;border-radius:4px}
.st.done{color:var(--green);background:#16301f}.st.failed{color:var(--red);background:#341818}.st.running{color:var(--amber);background:#33290f}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:var(--accent)}
.bar i.hot{background:var(--amber)}.bar i.over{background:var(--red)}
.split{display:grid;grid-template-columns:300px 1fr;gap:14px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-height:75vh;overflow:auto}
.list div{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;font:12px var(--mono)}.list div:hover,.list div.on{background:var(--panel2)}
.md{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 22px;overflow-x:auto;max-height:80vh;overflow-y:auto}
.md table{margin:10px 0}.md h1{font-size:20px;margin-top:0}.md code{font-family:var(--mono);color:var(--amber)}
.note{color:var(--dim);font-size:12px}
.dec{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.heat td{font:12px var(--mono);text-align:center}
.toast{position:fixed;bottom:16px;right:16px;background:var(--panel2);border:1px solid var(--accent);padding:10px 14px;border-radius:8px;display:none;max-width:360px;z-index:9}
@media(max-width:800px){.split{grid-template-columns:1fr}main{padding:12px}}
</style>
</head>
<body>
<header>
  <div><div class="brand"><b>vix</b> HQ</div><div class="tag" id="tagline">Virtual Interconnection eXchange · simulated</div></div>
  <nav>
    <button data-t="overview" class="on">Overview</button><button data-t="world">World</button>
    <button data-t="decisions">Decisions <span id="dcount"></span></button><button data-t="reports">Reports</button>
    <button data-t="schedules">Schedules</button>
  </nav>
</header>
<main>
  <section class="tab on" id="overview">
    <div class="kpis" id="kpis"></div>
    <h2>Super agents</h2><div class="grid" id="supers"></div>
    <h2>Departments</h2><div class="grid" id="depts"></div>
    <h2>Recent runs</h2><div class="tw"><table id="runs"></table></div>
  </section>
  <section class="tab" id="world">
    <h2>Metros</h2><div class="tw"><table id="metros"></table></div>
    <h2>Halls <select id="hallMetro"><option value="">all metros</option></select></h2><div class="tw"><table id="halls"></table></div>
    <h2>Round-trip latency (ms)</h2><div class="tw"><table class="heat" id="lat"></table></div>
    <p class="note" id="latnote"></p>
  </section>
  <section class="tab" id="decisions"><h2>Decisions filed by the super agents</h2><div id="declist"></div></section>
  <section class="tab" id="reports"><div class="split"><div class="list" id="replist"></div><div class="md" id="repview"><p class="note">Pick a report.</p></div></div></section>
  <section class="tab" id="schedules">
    <h2>Schedules</h2><div class="tw"><table id="sched"></table></div>
    <h2>Add</h2>
    <div class="card" style="display:flex;gap:8px;flex-wrap:wrap;align-items:end">
      <label class="note">Playbook<br><select id="sPb"></select></label>
      <label class="note">Every<br><input id="sEvery" value="daily 03:15" placeholder="hourly | daily HH:MM | weekly mon HH:MM"></label>
      <button class="b go" id="sAdd">Add schedule</button>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(p,o={})=>{const r=await fetch(p,{headers:{'content-type':'application/json'},...o});if(!r.ok)throw new Error((await r.json().catch(()=>({detail:r.statusText}))).detail);return r.headers.get('content-type')?.includes('json')?r.json():r.text()};
const money=v=>v==null?'–':'$'+(v>=1e6?(v/1e6).toFixed(2)+'M':Math.round(v).toLocaleString());
const pct=v=>v==null?'–':(v*100).toFixed(1)+'%';
const ago=t=>{if(!t)return'';const s=Date.now()/1000-t;return s<90?Math.round(s)+'s ago':s<5400?Math.round(s/60)+'m ago':s<172800?Math.round(s/3600)+'h ago':Math.round(s/86400)+'d ago'};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',4000)};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#'+b.dataset.t).classList.add('on');load(b.dataset.t)});

function pbHtml(p){
  const fields=Object.entries(p.params||{}).map(([k,s])=>{
    const v=s.default==null?'':s.default;
    if(s.choices)return `<label>${k}<select data-k="${k}" data-type="${s.type}">${s.choices.map(c=>`<option ${c==v?'selected':''}>${c}</option>`).join('')}</select></label>`;
    if(s.type==='bool')return `<label>${k}<select data-k="${k}" data-type="bool"><option value="">default</option><option ${v===true?'selected':''}>true</option><option ${v===false?'selected':''}>false</option></select></label>`;
    return `<label>${k}<input data-k="${k}" data-type="${s.type}" value="${esc(v)}" size="${String(v).length+4}"></label>`}).join('');
  return `<div class="pb" data-pb="${p.name}"><div class="t"><div><b>${esc(p.title)}</b><div class="d">${esc(p.description)}</div></div>
  <div style="display:flex;gap:4px">${fields?'<button class="b" data-act="opts">⚙</button>':''}<button class="b go" data-act="run">Run</button></div></div>
  <div class="params">${fields}</div></div>`}

function deptHtml(d){
  const lr=d.last_run;
  return `<div class="card ${d.tier==='super'?'super':''}"><div class="agent">${d.tier==='super'?'SUPER AGENT · ':''}${esc(d.agent)}</div><h3>${esc(d.name)}</h3>
  <div class="mission">${esc(d.mission)}</div>
  <div class="note">${d.runs_total} runs${lr?` · last <span class="st ${lr.status}">${lr.status}</span> ${ago(lr.started)} ${lr.report?`· <a href="#" data-rep="${lr.report}">report</a>`:''}`:''}</div>
  ${d.playbooks.map(pbHtml).join('')}</div>`}

async function overview(){
  const o=await api('/api/company');const k=o.kpis;
  $('#tagline').textContent=o.charter.tagline;
  $('#dcount').textContent=k.open_decisions?`(${k.open_decisions})`:'';
  const tiles=[['MRR',money(k.mrr_usd)],['EBITDA margin',pct(k.ebitda_margin)],['Cabinet util',pct(k.cabinet_util)],['IT load',k.it_load_mw+' MW'],
   ['Fleet PUE',k.fleet_pue??'–'],['Sites / halls',k.sites+' / '+k.halls],['Tenants',k.tenants],['Cross-connects',k.cross_connects.toLocaleString()],
   ['Virtual circuits',k.virtual_circuits],['Waitlisted',k.orders_waitlisted],['Open decisions',k.open_decisions],['Runs 7d',k.runs_7d+(k.failed_7d?` (${k.failed_7d} failed)`:'')],
   ['Route filtering',(k.network_standard.rs_filtering?'RS ':'')+(k.network_standard.edge_filtering?'edge':'')||'off']];
  $('#kpis').innerHTML=tiles.map(([l,v])=>`<div class="kpi"><div class="v">${esc(v)}</div><div class="l">${l}</div></div>`).join('');
  $('#supers').innerHTML=o.departments.filter(d=>d.tier==='super').map(deptHtml).join('');
  $('#depts').innerHTML=o.departments.filter(d=>d.tier!=='super').map(deptHtml).join('');
  const runs=await api('/api/company/runs?limit=25');
  $('#runs').innerHTML='<tr><th>#</th><th>Playbook</th><th>Dept</th><th>Status</th><th>Trigger</th><th>Started</th><th>Report</th></tr>'+
   runs.map(r=>`<tr><td class="n">${r.id}</td><td>${r.parent?'↳ ':''}${esc(r.playbook)}</td><td>${r.department}</td><td><span class="st ${r.status}">${r.status}</span></td><td class="note">${esc(r.trigger)}</td><td class="note">${ago(r.started)}</td><td>${r.report?`<a href="#" data-rep="${r.report}">open</a>`:''}</td></tr>`).join('');
}

document.addEventListener('click',async e=>{
  const a=e.target.closest('[data-rep]');if(a){e.preventDefault();openReport(a.dataset.rep);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const pb=b.closest('[data-pb]');
  if(b.dataset.act==='opts'){pb.querySelector('.params').classList.toggle('on');return}
  const params={};pb.querySelectorAll('[data-k]').forEach(i=>{let v=i.value;const t=i.dataset.type;if(v==='')return;
    if(t==='int')v=parseInt(v);else if(t==='float')v=parseFloat(v);else if(t==='bool')v=v==='true';params[i.dataset.k]=v});
  try{const r=await api('/api/company/run/'+pb.dataset.pb,{method:'POST',body:JSON.stringify(params)});toast(`Run #${r.run_id} started: ${pb.dataset.pb}`);poll(r.run_id)}catch(err){toast(err.message)}
});
async function poll(id){for(let i=0;i<120;i++){await new Promise(r=>setTimeout(r,1500));const r=await api('/api/company/runs/'+id);if(r.status!=='running'){toast(`Run #${id} ${r.status}`);overview();return}}}

function inl(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/(^|[\s(])_(.+?)_(?=$|[\s).,])/g,'$1<i>$2</i>')}
function mdHtml(src){
  const L=src.split('\n'),out=[];let i=0;
  while(i<L.length){const l=L[i];
    if(/^#{1,3} /.test(l)){const n=l.match(/^#+/)[0].length;out.push(`<h${n}>${inl(l.slice(n+1))}</h${n}>`);i++;continue}
    if(l.startsWith('|')&&L[i+1]&&/^\|[-| :]+\|?$/.test(L[i+1])){const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      let h='<div class="tw"><table><tr>'+cells(l).map(c=>`<th>${inl(c)}</th>`).join('')+'</tr>';i+=2;
      while(i<L.length&&L[i].startsWith('|')){h+='<tr>'+cells(L[i]).map(c=>`<td>${inl(c)}</td>`).join('')+'</tr>';i++}
      out.push(h+'</table></div>');continue}
    if(/^- /.test(l)){let h='<ul>';while(i<L.length&&/^- /.test(L[i])){h+=`<li>${inl(L[i].slice(2))}</li>`;i++}out.push(h+'</ul>');continue}
    if(l.trim()===''){i++;continue}
    let p=[];while(i<L.length&&L[i].trim()!==''&&!/^(#{1,3} |\||- )/.test(L[i])){p.push(L[i]);i++}
    out.push(`<p>${inl(p.join(' '))}</p>`)}
  return out.join('\n')}
function openReport(name){document.querySelector('nav [data-t=reports]').click();setTimeout(()=>showReport(name),150)}
async function showReport(name){
  document.querySelectorAll('#replist div').forEach(d=>d.classList.toggle('on',d.dataset.n===name));
  const md=await api('/api/company/reports/'+encodeURIComponent(name));
  $('#repview').innerHTML=mdHtml(md);
  $('#repview').querySelectorAll('td,p,li').forEach(el=>{el.innerHTML=el.innerHTML.replace(/(\d{8}-\d{4}-[\w]+-r\d+\.md)/g,'<a href="#" data-rep="$1">$1</a>')})}
async function reports(){const l=await api('/api/company/reports');$('#replist').innerHTML=l.map(r=>`<div data-n="${r.name}">${esc(r.name)}</div>`).join('')||'<div>No reports yet</div>';
  document.querySelectorAll('#replist div[data-n]').forEach(d=>d.onclick=()=>showReport(d.dataset.n))}

const bar=v=>`<div class="bar"><i class="${v>.92?'over':v>.85?'hot':''}" style="width:${Math.min(100,v*100)}%"></i></div>`;
async function worldTab(){
  const ms=await api('/api/world/metros');
  $('#metros').innerHTML='<tr><th>Metro</th><th>Region</th><th>Sites</th><th>Cabinets</th><th>Util</th><th>IT kW</th><th>X-conn</th><th>Tenants</th><th>Grid g/kWh</th><th>Renew</th><th>$/kWh</th></tr>'+
   ms.map(m=>`<tr><td><b>${m.code}</b> ${esc(m.name)}</td><td>${m.region}</td><td class="n">${m.sites}</td><td class="n">${m.cabinets_sold}/${m.cabinets_total}</td><td>${bar(m.cabinets_sold/m.cabinets_total)}</td><td class="n">${Math.round(m.it_load_kw).toLocaleString()}</td><td class="n">${m.cross_connects}</td><td class="n">${m.tenants_present}</td><td class="n">${m.grid_gco2_kwh}</td><td class="n">${m.renewable_pct}%</td><td class="n">${m.power_usd_kwh}</td></tr>`).join('');
  const sel=$('#hallMetro');if(sel.options.length<2)ms.forEach(m=>sel.add(new Option(m.code+' '+m.name,m.code)));
  sel.onchange=halls;halls();
  const L=await api('/api/world/latency');const mx=Math.max(...L.rtt_ms.flat());
  $('#lat').innerHTML='<tr><th></th>'+L.metros.map(m=>`<th>${m}</th>`).join('')+'</tr>'+L.metros.map((a,i)=>`<tr><th>${a}</th>${L.rtt_ms[i].map(v=>`<td style="background:rgba(79,209,197,${(v/mx*.55).toFixed(2)})">${v}</td>`).join('')}</tr>`).join('');
  $('#latnote').textContent='Model: '+L.model;
}
async function halls(){const hs=await api('/api/world/halls'+($('#hallMetro').value?'?metro='+$('#hallMetro').value:''));
  $('#halls').innerHTML='<tr><th>Hall</th><th>Cabinets</th><th>Space</th><th>Power (contracted/utility kW)</th><th>Power</th><th>IT kW</th><th>Cooling</th></tr>'+
  hs.map(h=>`<tr><td><b>${h.id}</b></td><td class="n">${h.cabinets_sold}/${h.cabinets_total}</td><td>${bar(h.cab_util)}</td><td class="n">${Math.round(h.contracted_kw)}/${h.utility_kw}</td><td>${bar(h.power_util)}</td><td class="n">${Math.round(h.it_load_kw)}</td><td class="n" style="color:${h.crah_down?'var(--amber)':'inherit'}">${h.crah_units-h.crah_down}/${h.crah_units} CRAH</td></tr>`).join('')}

async function decisionsTab(){const ds=await api('/api/company/decisions');
  $('#declist').innerHTML=ds.map(d=>`<div class="card" style="margin-bottom:10px"><div class="dec"><div><div class="agent">#${d.id} · ${esc(d.agent)} · ${d.kind}</div><h3>${esc(d.title)}</h3>
  <div class="mission">${Object.entries(d.detail).map(([k,v])=>`<b>${esc(k)}</b>: ${esc(typeof v==='number'&&v>1e5?money(v):v)}`).join(' · ')}</div>
  <div class="note">${ago(d.ts)}${d.note?' · '+esc(d.note):''}</div></div>
  <div>${d.status==='open'?`<button class="b ok" data-dec="${d.id}" data-ap="1">Approve</button> <button class="b no" data-dec="${d.id}" data-ap="0">Reject</button>`:`<span class="st ${d.status==='approved'?'done':'failed'}">${d.status}</span>`}</div></div></div>`).join('')||'<p class="note">No decisions yet. The Chief Operator files them in the weekly review; the Chief Scientist in the research cycle.</p>';
  document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=async()=>{try{const r=await api('/api/company/decisions/'+b.dataset.dec,{method:'POST',body:JSON.stringify({approve:b.dataset.ap==='1',note:'founder via HQ'})});toast(`Decision #${r.decision} ${r.status}`);decisionsTab();overview()}catch(err){toast(err.message)}})}

async function schedTab(){const ss=await api('/api/company/schedules');
  $('#sched').innerHTML='<tr><th>#</th><th>Playbook</th><th>Every</th><th>Next run</th><th>Last run</th><th></th></tr>'+
   ss.map(s=>`<tr><td class="n">${s.id}</td><td>${esc(s.playbook)}</td><td>${esc(s.every)}</td><td class="note">${s.next_run?new Date(s.next_run*1000).toLocaleString():'paused'}</td><td class="note">${ago(s.last_run)}</td>
   <td><button class="b" data-s="${s.id}" data-en="${s.enabled?0:1}">${s.enabled?'Pause':'Resume'}</button> <button class="b no" data-sd="${s.id}">Delete</button></td></tr>`).join('');
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{await api('/api/company/schedules/'+b.dataset.s,{method:'PATCH',body:JSON.stringify({enabled:b.dataset.en==='1'})});schedTab()});
  document.querySelectorAll('[data-sd]').forEach(b=>b.onclick=async()=>{await api('/api/company/schedules/'+b.dataset.sd,{method:'DELETE'});schedTab()});
  const pbs=await api('/api/company/playbooks');$('#sPb').innerHTML=pbs.map(p=>`<option value="${p.name}">${p.name}</option>`).join('')}
$('#sAdd').onclick=async()=>{try{await api('/api/company/schedules',{method:'POST',body:JSON.stringify({playbook:$('#sPb').value,every:$('#sEvery').value})});schedTab()}catch(err){toast(err.message)}};

function load(t){({overview,world:worldTab,decisions:decisionsTab,reports,schedules:schedTab})[t]().catch(e=>toast(e.message))}
overview().catch(e=>toast(e.message));setInterval(()=>{if($('#overview').classList.contains('on'))overview().catch(()=>{})},20000);
</script>
</body>
</html>
